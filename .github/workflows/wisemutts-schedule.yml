name: WiseMutts Daily Automation

on:
  push:
    branches-ignore:
      - '**'
    tags-ignore:
      - '**'

# Original triggers kept here for later re-enable:
# schedule:
#   - cron: '0 21 * * *'  # Daily at 6 PM Sao Paulo time (9 PM UTC)
# workflow_dispatch:  # Manual trigger option

permissions:
  id-token: write
  contents: read

jobs:
  trigger-lambda:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: github-actions-wisemutts

      - name: Invoke Lambda function
        run: |
          aws lambda invoke \
            --function-name wisemutts \
            --invocation-type Event \
            response.json
          
          echo "Lambda invocation response:"
          cat response.json

