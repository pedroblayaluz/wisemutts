name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/deploy-to-lambda.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: github-actions-${{ github.run_id }}
          role-duration-seconds: 900
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Create Lambda Layer package
        run: |
          mkdir -p layer/python
          pip install -r requirements.txt -t layer/python
          cd layer
          zip -r ../lambda-layer.zip .
          cd ..
      
      - name: Deploy Lambda Layer
        env:
          LAYER_NAME: wisemutts-dependencies
        run: |
          aws lambda publish-layer-version \
            --layer-name ${{ env.LAYER_NAME }} \
            --zip-file fileb://lambda-layer.zip \
            --compatible-runtimes python3.10 \
            --output json > layer-version.json
          
          LAYER_VERSION_ARN=$(jq -r '.LayerVersionArn' layer-version.json)
          echo "LAYER_VERSION_ARN=$LAYER_VERSION_ARN" >> $GITHUB_ENV
      
      - name: Create function code package
        run: |
          mkdir -p function
          cp -r src/ function/
          cd function
          zip -r ../lambda-function.zip .
          cd ..
      
      - name: Deploy function code
        env:
          FUNCTION_NAME: wisemutts
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.FUNCTION_NAME }} \
            --zip-file fileb://lambda-function.zip
      
      - name: Update function layers
        env:
          FUNCTION_NAME: wisemutts
        run: |
          aws lambda update-function-configuration \
            --function-name ${{ env.FUNCTION_NAME }} \
            --layers ${{ env.LAYER_VERSION_ARN }}
      
      - name: Verify deployment
        env:
          FUNCTION_NAME: wisemutts
        run: |
          aws lambda get-function \
            --function-name ${{ env.FUNCTION_NAME }} \
            --query 'Configuration.LastModified' \
            --output text
